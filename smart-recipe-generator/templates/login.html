<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-100 to-lime-100 min-h-screen flex items-center justify-center font-sans">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-xl w-full">
    <h1 class="text-3xl font-bold text-center text-green-700 mb-6">🍽️ Login</h1>

    <!-- Error Message -->
    {% if error_message %}
    <div class="bg-red-200 text-red-800 p-3 rounded-lg mb-4">
      <p>{{ error_message }}</p>
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" class="space-y-5">
      <div>
        <label class="block text-gray-700 font-medium">Email</label>
        <input type="email" name="email" required
               class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <div>
        <label class="block text-gray-700 font-medium">Password</label>
        <input type="password" name="password" required
               class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <button type="submit"
              class="w-full py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">Login</button>
    </form>

    <!-- Sign-Up Link -->
    <p class="text-center mt-4">Don't have an account? <a href="{{ url_for('signup') }}" class="text-green-500">Sign up here</a></p>
  </div>
</body>
</html>
