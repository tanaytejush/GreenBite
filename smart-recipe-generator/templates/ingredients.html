<h2>Add Ingredients</h2>
<form method="post">
    Ingredient: <input name="name" required>
    Days until expiry: <input name="days_left" type="number" required>
    <button type="submit">Add</button>
</form>

<h3>Your Ingredients:</h3>
<ul>
{% for item in ingredients %}
    <li>{{ item.name }} - {{ item.days_left }} days left</li>
{% endfor %}
</ul>

<a href="{{ url_for('recommend', username=username) }}">Generate Recipes</a>
