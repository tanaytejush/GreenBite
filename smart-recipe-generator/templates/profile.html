<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Your Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-100 to-lime-100 min-h-screen flex items-center justify-center font-sans">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-xl w-full">
    <h1 class="text-3xl font-bold text-center text-green-700 mb-6">🍽️ Create Your Food Profile</h1>

    <form id="profileForm" class="space-y-5" method="POST"action="/profile">
      <!-- Name -->
      <div>
        <label class="block text-gray-700 font-medium">Name</label>
        <input type="text" name="name" required
               class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <!-- Food Preference -->
      <div>
        <label class="block text-gray-700 font-medium">Food Preference</label>
        <select name="food_preference" required
                class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="">-- Select --</option>
          <option value="non_vegetarian">Non-Vegetarian</option>
          <option value="vegetarian">Vegetarian</option>
          <option value="vegan">Vegan</option>
          <option value="pescatarian">Pescatarian</option>
          <option value="eggetarian">Eggetarian</option>
          <option value="flexitarian">Flexitarian</option>
        </select>
      </div>

      <!-- Dietary Goal -->
      <div>
        <label class="block text-gray-700 font-medium">Dietary Goal</label>
        <select name="dietary_goal" required
                class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="">-- Select --</option>
          <option value="bulking">Bulking</option>
          <option value="cutting">Cutting</option>
          <option value="maintenance">Maintenance</option>
          <option value="keto">Keto</option>
          <option value="paleo">Paleo</option>
          <option value="high_protein">High Protein</option>
          <option value="low_carb">Low Carb</option>
        </select>
      </div>

      <!-- Allergies (multiple selection) -->
      <div>
        <label class="block text-gray-700 font-medium">Allergies (Ctrl+Click to select multiple)</label>
        <select name="allergies" multiple
                class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="gluten">Gluten</option>
          <option value="dairy">Dairy</option>
          <option value="nuts">Nuts</option>
          <option value="soy">Soy</option>
          <option value="eggs">Eggs</option>
          <option value="fish">Fish</option>
          <option value="shellfish">Shellfish</option>
        </select>
      </div>

      <!-- Flavor Preferences (multiple selection) -->
      <div>
        <label class="block text-gray-700 font-medium">Flavor Preferences (Ctrl+Click to select multiple)</label>
        <select name="flavors" multiple
                class="w-full p-2 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          <option value="spicy">Spicy</option>
          <option value="sweet">Sweet</option>
          <option value="savory">Savory</option>
          <option value="sour">Sour</option>
          <option value="umami">Umami</option>
          <option value="earthy">Earthy</option>
          <option value="cheesy">Cheesy</option>
          <option value="buttery">Buttery</option>
        </select>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" class="w-full py-2 bg-green-500 text-white font-semibold rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
          Save Profile
        </button>
      </div>
    </form>
  </div>
</body>
</html>
